<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Manager</title>
<style>
body{font-family:Arial;background:#f0fdfa;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
input{padding:11px;margin:6px;box-sizing:border-box;width:42%}
button{padding:10px 14px;background:#0f766e;color:white;border:0;border-radius:7px;cursor:pointer}
.product{background:#ccfbf1;padding:13px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
</style>
</head>
<body>
<main>
<h1>Inventory Manager</h1>
<input id="name" placeholder="Product name">
<input id="stock" type="number" min="0" placeholder="Stock quantity">
<button onclick="addProduct()">Add Product</button>
<h2>Inventory List</h2>
<div id="list"></div>
<p id="summary"></p>
</main>
<script>
let products=JSON.parse(localStorage.getItem("inventory")||"[]");
function save(){
 localStorage.setItem("inventory",JSON.stringify(products));
 render();
}
function addProduct(){
 const name=document.getElementById("name").value.trim();
 const field=document.getElementById("stock");
 const stock=Number(field.value);
 if(!name||field.value===""||!Number.isInteger(stock)||stock<0){
  alert("Enter a valid product name and stock quantity.");
  return;
 }
 const existing=products.find(p=>p.name.toLowerCase()===name.toLowerCase());
 if(existing)existing.stock+=stock;
 else products.push({name,stock});
 document.getElementById("name").value="";
 field.value="";
 save();
}
function render(){
 const list=document.getElementById("list");
 list.innerHTML="";
 products.forEach((p,i)=>{
  const row=document.createElement("div");
  row.className="product";
  const info=document.createElement("span");
  info.textContent=p.name+" — Stock: "+p.stock;
  const remove=document.createElement("button");
  remove.textContent="Delete";
  remove.onclick=()=>{products.splice(i,1);save();};
  row.append(info,remove);
  list.appendChild(row);
 });
 document.getElementById("summary").textContent=
 "Products: "+products.length+" | Total stock: "+
 products.reduce((sum,p)=>sum+p.stock,0);
}
render();
</script>
</body>
</html>
